services:
  - type: web
    name: irescue-diplahan
    runtime: docker
    plan: starter
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /healthz.php
    envVars:
      - key: LDRRMO_DB_HOST
        sync: false
      - key: LDRRMO_DB_PORT
        sync: false
      - key: LDRRMO_DB_NAME
        sync: false
      - key: LDRRMO_DB_USER
        sync: false
      - key: LDRRMO_DB_PASSWORD
        sync: false
      - key: LDRRMO_APP_URL
        sync: false
      - key: LDRRMO_SMTP_HOST
        sync: false
      - key: LDRRMO_SMTP_PORT
        value: "465"
      - key: LDRRMO_SMTP_USERNAME
        sync: false
      - key: LDRRMO_SMTP_PASSWORD
        sync: false
      - key: LDRRMO_SMTP_SENDER_EMAIL
        sync: false
      - key: LDRRMO_SMTP_SENDER_NAME
        value: LDRRMO Diplahan
      - key: LDRRMO_PRIVATE_UPLOAD_DIR
        value: /var/data/report-uploads
    disk:
      name: report-uploads
      mountPath: /var/data
      sizeGB: 1
